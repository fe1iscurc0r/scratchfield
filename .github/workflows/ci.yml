name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.workbuddy/**'
      - 'vendor/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.workbuddy/**'
      - 'vendor/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: |
          pip install ruff

      - name: Lint Python
        run: ruff check . --output-format=github

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Lint Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present

  # 快速冒烟测试（不跑全量，全量在 build-release.yml）
  smoke:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Quick import check
        run: |
          python -c "
          import system.config_manager
          import system.health_check
          import rag.rag_service
          import mcpserver.mcp_server
          print('All core modules OK')
          "

      - name: Run tests
        run: pytest tests/ -v --timeout=60 -x
