name: CI Nightly

# 卷173 分层测试矩阵的 core/full 层——本机跑不动 46k 全量、CI 也不该每次 push 全跑：
#   core 层（≤10min 目标）每晚跑一次，full 层每周日跑一次。
#
# ⚠️ 闸门铁律（与 ci.yml 同源）：全部 job 挂 ENABLE_CI_TEST 闸门变量——
#   Actions 账单未解封期间 hosted runner 不会被调度，变量未设 ⇒ skipped（绿），
#   不造永久红灯。恢复：Settings → Secrets and variables → Actions →
#   Variables 新建 ENABLE_CI_TEST = true。
#   ⚠️ job 级 if 只允许 vars context，不许 env context（历史坑见 ci.yml lint 注释）。

on:
  schedule:
    - cron: '0 3 * * *'        # 每日 03:00 UTC（北京 11:00）—— core 层
    - cron: '0 4 * * 0'        # 每周日 04:00 UTC —— full 层（在同一个 schedule 里按 job 拆）
  workflow_dispatch:
    inputs:
      layer:
        description: '测试层'
        required: true
        default: 'core'
        type: choice
        options:
          - core
          - full

permissions:
  contents: read

jobs:
  core-nightly:
    if: ${{ vars.ENABLE_CI_TEST == 'true' && (github.event_name == 'workflow_dispatch' && github.event.inputs.layer == 'core' || github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install --no-cache-dir uv

      # pytest 用 `uv run --with` 叠上去，而不是 `uv pip install` 后再 `uv run pytest`：
      # uv run 会按 lockfile 同步环境，把手工装进去的包剪掉（sync 是精确的）。
      # 也不用裸 `pytest`：overlay 的控制台脚本不保证在 PATH 上，`python -m pytest` 才稳。
# 版本与 build-release.yml 的 `pip install "pytest==9.1.1"` 对齐，避免两处漂移。
      - name: Sync deps
        # pytest **不在** pyproject 的任何依赖组里（build=pyinstaller、test=google-genai），
        # 所以 `uv run pytest` 必然报 `Failed to spawn: pytest` —— 这就是 nightly 从来
        # 没真正跑起来过的原因。2026-10-17 曾把这里改成 `--group test` 并注释「pytest 在
        # test 组」，那是误判：test 组里也没有 pytest。真解法在下面的 `--with`。
        run: uv sync --group build --group test

      - name: Run core layer
        run: uv run --with "pytest==9.1.1" python -m pytest -m core -q --junitxml=build/test-results/core-junit.xml

      - name: Upload junit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-junit
          path: build/test-results/core-junit.xml
          if-no-files-found: ignore

  full-weekly:
    if: ${{ vars.ENABLE_CI_TEST == 'true' && (github.event_name == 'workflow_dispatch' && github.event.inputs.layer == 'full' || github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install --no-cache-dir uv

      # pytest 用 `uv run --with` 叠上去，而不是 `uv pip install` 后再 `uv run pytest`：
      # uv run 会按 lockfile 同步环境，把手工装进去的包剪掉（sync 是精确的）。
      # 也不用裸 `pytest`：overlay 的控制台脚本不保证在 PATH 上，`python -m pytest` 才稳。
# 版本与 build-release.yml 的 `pip install "pytest==9.1.1"` 对齐，避免两处漂移。
      - name: Sync deps
        # pytest **不在** pyproject 的任何依赖组里（build=pyinstaller、test=google-genai），
        # 所以 `uv run pytest` 必然报 `Failed to spawn: pytest` —— 这就是 nightly 从来
        # 没真正跑起来过的原因。2026-10-17 曾把这里改成 `--group test` 并注释「pytest 在
        # test 组」，那是误判：test 组里也没有 pytest。真解法在下面的 `--with`。
        run: uv sync --group build --group test

      # full 层 = tests/ 全量（未标注文件默认 full；NEKO 等已在 pyproject
      # norecursedirs 收集期排除）
      - name: Run full layer
        run: uv run --with "pytest==9.1.1" python -m pytest tests/ -q --junitxml=build/test-results/full-junit.xml

      - name: Upload junit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-junit
          path: build/test-results/full-junit.xml
          if-no-files-found: ignore
