name: neko-sync

# 一次性：把上游 N.E.K.O 的更新落到 NEKO/N.E.K.O/，保住 scratchfield 自己那批补丁。
# 全程 plumbing 层（update-index --index-info + 上游真实 blob），不经过工作树，
# 因此落地字节与上游完全一致，不受 .gitattributes 行尾规则影响。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neko-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream (depth 1)
        run: |
          git remote add upstream https://github.com/Project-N-E-K-O/N.E.K.O.git
          git fetch --depth=1 upstream f7d274464691cc5fccc3bcf1fae9d82cfa46296e
          got=$(git rev-parse FETCH_HEAD)
          echo "FETCH_HEAD=$got"
          test "$got" = "f7d274464691cc5fccc3bcf1fae9d82cfa46296e"

      - name: Apply into index
        run: |
          python3 .neko-sync/apply.py

      - name: Commit
        run: |
          git config user.name "neko-sync-bot"
          git config user.email "neko-sync-bot@users.noreply.github.com"
          git commit -m "chore(neko): sync upstream N.E.K.O 96dd262580 -> f7d2744646 (107 commits)" -m "Applied at the index level with the upstream blobs' own mode/sha, so the landed bytes are identical to upstream and unaffected by .gitattributes line-ending rules." -m "285 new paths, 1550 replaced, 8 removed. 22 patch files keep scratchfield's own hardening (HMAC-from-env for survey/telemetry, monitor loopback policy, app_launcher autostart gate, proactive_chat totals guard) plus their tests." -m "Follows upstream PR #3015: drops the leftover OpenFang channel (app/agent_server/channels/openfang.py, brain/openfang_adapter.py, its test) and updates the two use-claw docs we maintain ourselves." -m "Also applies Scratchpad main 2b1fceb1 so both repos match."

      - name: Push
        run: |
          git push origin HEAD:main

      - name: Verify
        run: |
          git log --oneline -2
          echo "--- 上游已删除的路径应不存在 ---"
          git ls-files -- "NEKO/N.E.K.O/plugin/utils/zeromq_ipc.py" "NEKO/N.E.K.O/brain/openfang_adapter.py" | wc -l
          echo "--- 新增路径应存在 ---"
          git ls-tree HEAD -- "NEKO/N.E.K.O/main_logic/core/turn_context.py"
          echo "--- 补丁文件应保留我们的内容 ---"
          git ls-tree HEAD -- "NEKO/N.E.K.O/utils/survey_client.py" "NEKO/N.E.K.O/local_server/survey_server/security.py"
