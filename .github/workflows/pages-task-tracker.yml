name: Deploy lumo-task-tracker to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "lumo-task-tracker/**"
      - ".github/workflows/pages-task-tracker.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (lumo-task-tracker 子目录作为站点根)
        uses: actions/upload-pages-artifact@v3
        with:
          path: lumo-task-tracker

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
