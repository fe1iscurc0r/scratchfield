name: Deploy lumo-task-tracker to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "lumo-task-tracker/**"
      - ".github/workflows/pages-task-tracker.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # TODO(2026-10-19): ubuntu-latest 将迁移到 Ubuntu 26（actions/runner-images#14748），
    # 届时若有不兼容（glibc/Python ABI 等）需显式钉死版本，如 ubuntu-24.04。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact (lumo-task-tracker 子目录作为站点根)
        uses: actions/upload-pages-artifact@v3
        with:
          path: lumo-task-tracker

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
