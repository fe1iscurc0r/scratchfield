version: 2
updates:
  # Python 依赖 (pip/uv)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "fe1iscurc0r"

  # 前端依赖 (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    assignees:
      - "fe1iscurc0r"
    # sprintf-js：无可用修复版本，显式忽略（否则每周触发
    # security_update_not_found 失败 run，见 2026-10-06 run 37433906386）。
    #   引入链（实测 2026-10-06）：
    #     app-builder-lib → @electron/get → global-agent → roarr@2.15.4 → sprintf-js@1.1.3
    #   结论：该链是 electron-builder 的合法 optional 依赖（非死重），无法拔除；
    #     sprintf-js 1.1.3 为末版（上游停更），不存在可升级版本。
    #     CVE 仅影响 dev 构建链，生产构建不受影响。
    ignore:
      - dependency-name: "sprintf-js"
      # pixi.js：v8 与 pixi-live2d-display@0.4.0 硬不兼容（其 peerDependencies
      # 要求 @pixi/*: ^6，且无 v8 兼容的稳定版）——大版本升级会直接炸前端类型闸门，
      # 导致发版构建连续失败（2026-10-09 v5.2.6/5.2.7/5.2.8 三连红，PR #159 引入）。
      # 只挡 major；6.x 的 minor/patch 照常收。
      - dependency-name: "pixi.js"
        update-types: ["version-update:semver-major"]
      # typescript：7.x 是 Go 原生重写版，vue-tsc/@volar 工具链兼容性未验证
      # （PR #39 曾提 5.9.3 → 7.0.2）。需要时人工评估后手动升。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
