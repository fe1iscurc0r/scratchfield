version: 2
updates:
  # Python 依赖 (pip) —— 下限对齐；lock 由下面的 uv 条目维护
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "fe1iscurc0r"
    groups:
      pip-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # litellm：**1.83.1~1.84.0rc1 双硬钉**（openai==2.30.0/2.24.0/2.33.0 且 tiktoken==0.12.0，逐版本实查 PyPI 元数据），1.84.x~1.105.x 钉 openai<3.0.0 —— 与本仓 openai/tiktoken 下限互斥。
      #   上游 BerriAI/litellm PR #44927 已 merged（openai<4.0.0）但**未发布**；
      #   1.106.0 正式发布后 dependabot 会自动提，届时删掉本规则。
      #   复核命令：uv lock --upgrade-package litellm && uv lock --check
      - dependency-name: "litellm"
        versions: [">=1.83.1,<1.106.0"]
      # websockets：**全量忽略**——本仓 requirements.txt 的 websockets>=17.0.1 与 pyproject 的
      #   >=14.0,<17.0 相互矛盾（docling-slim[standard] 卡 <17.0），清单对齐落地前先全停。
      - dependency-name: "websockets"
      # anthropic 0.x→1.x：1.x 引入 httpx2，需先验证 litellm 的 anthropic provider。
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]
      # pandas 2.x→3.x：CoW 默认开启 + 字符串 dtype 变更，需单独回归。
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      # tokenizers：transformers 5.3.0 卡 tokenizers<=0.23.0，>=0.23.2 不可满足。
      - dependency-name: "tokenizers"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # 前端依赖 (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    assignees:
      - "fe1iscurc0r"
    ignore:
      # sprintf-js：无可用修复版本（末版 1.1.3，上游停更）。引入链（实测 2026-10-06）：
      #   app-builder-lib → @electron/get → global-agent → roarr@2.15.4 → sprintf-js@1.1.3，
      #   属 electron-builder 的合法 optional 依赖；CVE 仅影响 dev 构建链。
      - dependency-name: "sprintf-js"
      # pixi.js：v8 与 pixi-live2d-display@0.4.0 硬不兼容（peer 要求 @pixi/*: ^6，无 v8 兼容版），
      #   大版本升级会炸前端类型闸门 → 发版构建失败（v5.2.6/5.2.7/5.2.8 三连红的根因）。
      - dependency-name: "pixi.js"
        update-types: ["version-update:semver-major"]
      # typescript：7.x 是 Go 原生重写版，vue-tsc/@volar 兼容性未验证（PR #39 曾提 7.0.2）。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Python 依赖（uv 生态）—— 直接维护 uv.lock，与 pip 条目并存
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "fe1iscurc0r"
    groups:
      uv-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # ⚠️ 与 pip 条目同源的例外（**dependabot 的 ignore 按生态环境独立，两处各要一份**）：
      - dependency-name: "litellm"
        versions: [">=1.83.1,<1.106.0"]
      - dependency-name: "websockets"
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tokenizers"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # GitHub Actions —— 更新器在本仓持续 unknown_error，暂停版本更新（安全更新不受影响）
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
