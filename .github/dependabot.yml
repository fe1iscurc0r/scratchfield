version: 2
updates:
  # Python 依赖 (pip/uv)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "fe1iscurc0r"

  # 前端依赖 (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    assignees:
      - "fe1iscurc0r"
    # sprintf-js：无可用修复版本，显式忽略（否则每周触发
    # security_update_not_found 失败 run，见 2026-10-06 run 37433906386）。
    #   引入链（实测 2026-10-06）：
    #     app-builder-lib → @electron/get → global-agent → roarr@2.15.4 → sprintf-js@1.1.3
    #   结论：该链是 electron-builder 的合法 optional 依赖（非死重），无法拔除；
    #     sprintf-js 1.1.3 为末版（上游停更），不存在可升级版本。
    #     CVE 仅影响 dev 构建链，生产构建不受影响。
    ignore:
      - dependency-name: "sprintf-js"
      # pixi.js：v8 与 pixi-live2d-display@0.4.0 硬不兼容（其 peerDependencies
      # 要求 @pixi/*: ^6，且无 v8 兼容的稳定版）——大版本升级会直接炸前端类型闸门，
      # 导致发版构建连续失败（2026-10-09 v5.2.6/5.2.7/5.2.8 三连红，PR #159 引入）。
      # 只挡 major；6.x 的 minor/patch 照常收。
      - dependency-name: "pixi.js"
        update-types: ["version-update:semver-major"]
      # typescript：7.x 是 Go 原生重写版，vue-tsc/@volar 工具链兼容性未验证
      # （2026-10-10 展示仓 PR #39 曾提 5.9.3 → 7.0.2）。需要时人工评估后手动升。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Python 依赖（uv 生态）——与上面的 pip 条目并存：
  #   pip 条目只改 pyproject/requirements 的版本下限，**不会更新 uv.lock**，
  #   导致 lock 与清单脱节（实测：#236 aiohttp>=3.14.4 vs lock 3.14.3；
  #   #239 cryptography>=50.0.2 vs lock 50.0.1 —— 合并即让 uv lock --check 失败）。
  #   uv 生态条目直接维护 uv.lock，从机制上消灭这类脱节。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "fe1iscurc0r"
  # GitHub Actions
  # ⚠️ 2026-10-10 起暂停本生态的**版本更新**（open-pull-requests-limit: 0）：
  #   dependabot 的 actions 更新器在本仓持续以 `unknown_error` 失败
  #   （实测日志：Updating actions/setup-node from 4 to 7 后 -> record_update_job_unknown_error，
  #    同一轮里 upload-artifact / configure-pages / setup-python / deploy-pages 均报 unknown_error），
  #   每周产出一次红灯 run。这是 GitHub 侧更新器的问题，仓库配置无法消除。
  #   安全更新不受此限（仍会自动开 PR）。恢复方法：把 0 改为非 0。
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
