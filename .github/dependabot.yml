version: 2
updates:
  # Python 依赖 (pip/uv)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "fe1iscurc0r"

  # 前端依赖 (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    assignees:
      - "fe1iscurc0r"
    # sprintf-js：无可用修复版本，显式忽略（否则每周触发
    # security_update_not_found 失败 run，见 2026-10-06 run 37433906386）。
    #   引入链（实测 2026-10-06）：
    #     app-builder-lib → @electron/get → global-agent → roarr@2.15.4 → sprintf-js@1.1.3
    #   结论：该链是 electron-builder 的合法 optional 依赖（非死重），无法拔除；
    #     sprintf-js 1.1.3 为末版（上游停更），不存在可升级版本。
    #     CVE 仅影响 dev 构建链，生产构建不受影响。
    ignore:
      - dependency-name: "sprintf-js"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
