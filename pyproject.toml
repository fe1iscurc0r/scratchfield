[project]
name = "lumo"
version = "5.1.5"
description = "陆墨 - 材料科研桌面助手，支持多MCP服务、流式语音交互、GRAG知识图谱记忆系统、RESTful API接口、控制台托盘功能"
authors = [
    {name = "柏斯阔落", email = "1781393885@qq.com"},
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ---------- 核心 / 配置 ----------
    "charset-normalizer>=3.4.0",
    "json5>=0.15.0",
    "PyYAML>=6.0.2",
    "pydantic>=2.11.0",
    "requests>=2.32.0",
    "python-multipart>=0.0.32",
    # ---------- Web 服务 ----------
    "fastapi>=0.115.0",
    "uvicorn>=0.52.4",
    "sse-starlette>=2.3.0",
    "httpx[socks]>=0.28.1",
    # 上限与 docling-slim[standard] (pdf2md extra) 的 websockets>=14.0,<17.0 对齐，
    # 否则根 uv.lock 无法重求解（卷161 死锁第一层）。
    # 代码面已核实仅用稳定 API：connect/extra_headers/ConnectionClosed/serve/
    # ping_interval（openai_adapter.py:122、openclaw/ws_client.py:64、qqbot.py:132）。
    "websockets>=14.0,<17.0",
    # ---------- LLM / 对话 ----------
    "openai>=3.8.0",
    "anthropic>=0.42.0",
    "litellm>=1.104.0",
    "tiktoken>=0.11.0",
    "langchain-openai>=1.1.0",
    "langchain-community>=0.3.30",
    # ---------- 异步 / 任务 ----------
    "aiohttp>=3.14.3",
    "aiofiles>=24.1.0",
    "APScheduler>=3.11.0",
    # ---------- 系统 / 工具 ----------
    "numpy>=2.4.6",

    # rf_brain/decoders/ft8.py 模块级硬 import scipy.signal；tools/ 等处亦有引用。
    # （2026-10-01 补录）此前 scipy 仅经 docling-slim[standard]（pdf2md extra）传递进锁，
    # 干净环境不带 extra 时该 import 链崩。下限=审计时实测版。
    "scipy>=1.18.0",
    "pandas>=2.2.0",
    "pillow>=11.0.0",
    "psutil>=7.1.0",
    "emoji>=2.16.0",
    # 下限抬到 49.0.0：49.0.0 是 CVE-2026-69249 / CVE-2026-69248 的
    # first_patched_version（原 >=46.0.0 落在漏洞区间 >=45,<49 内，卷161）。
    "cryptography>=49.0.0",
    "setproctitle>=1.3.5",
    "watchfiles>=1.2.0",
    # ---------- 语音 / 音频 ----------
    "edge-tts>=7.0.0",
    "sounddevice>=0.5.6",
    # ---------- 知识图谱 GRAG / 兼容层 ----------
    "py2neo>=2021.2.3",
    "neo4j>=5.0.0",
    "chromadb>=0.5.0",
    "mss>=10.1.0",
    # authlib 是 chromadb 的传递依赖，但一直未被直接声明（卷161 死锁第二层）。
    # 显式声明使版本可被 dependabot 追踪并保证下限。
    # 事实校正（实测 dependabot alerts @main 368b87a4）：authlib 的 critical
    # （GHSA-wvwj-cvrp-7pv5，#279/#142）全部挂在 NEKO/ 下的 manifest，
    # 根 uv.lock 无 authlib 告警 —— 故本行不改变根 uv.lock 的 critical 计数。
    # 注：工单原文写作 ">=49.0.0"，但 authlib 版本体系为 1.x（最新 1.8.0），
    # 49.0.0 在 PyPI 上不存在（49.0.0 实为 cryptography 的修复阈值）。
    # 此处按工单「退到能解的最高版」授权，取 1.6.9（该 CVE 的 first_patched）。
    "authlib>=1.6.9",
    # 数据工具路由 routes/data_tools.py 在模块级硬 import（科研风 PNG 图表）。
    # 2026-09-29 补录：此前代码 import 了但依赖未声明（venv 能跑只是因为本地装过）。
    "matplotlib>=3.8.0",
    # 依赖审计（2026-09-29）补录两项：
    # - dashscope：voice/input/voice_realtime/adapters/qwen/client.py 模块级硬 import，
    #   且 voice_realtime/__init__ 导出该适配器 → 缺包时整个 voice_realtime 链崩
    #   （同 matplotlib 前科：venv 能跑只是因为本地装过）。下限=审计时实测版。
    "dashscope>=1.27.7",
    # - starlette：naga_auth.py 模块级直接 import（from starlette.requests import Request）。
    #   fastapi 的传递依赖保证存在；按卷161「直接 import 应显式声明」原则显式化，
    #   版本跟随 fastapi 解析，不重复 pin。
    "starlette",
]

[project.optional-dependencies]
# 本地 kokoro-onnx 离线 TTS 引擎（Edge TTS 断网时兜底）
local-tts = [
    "onnxruntime>=1.20.1",
    "espeakng-loader>=0.2.4",
    "phonemizer-fork>=3.3.2",
    "misaki-fork[zh]>=0.9.0",
]
# 论文 PDF → Markdown 管线（mcpserver/adapters/pdf2md_adapter，台账⑤）
# Docling 主力（中文 OCR/表格结构/图像提取）+ MarkItDown 降级
pdf2md = [
    "docling>=2.125.0",
    "markitdown[pdf]>=0.1.8",
]
# 卷163：法学判例本地导入管线（domains/law/importers/case_import）
# - .docx：python-docx（本卷唯一新增依赖，工单已授权）
# - .pdf ：复用上面的 pdf2md extra（docling）
# - .xlsx：openpyxl（pandas 已传递依赖，此处显式声明以免环境漂移）
law-import = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
workflow-board = "mcpserver.workflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["apiserver", "agentserver", "summer_memory", "thinking", "ui", "voice"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "NEKO",
    "skills",
    "vendor",
    ".venv",
    "node_modules",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import 排序)
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
]
ignore = [
    # --- 行长度 / 格式 ---
    "E501",  # line-too-long (由 formatter 处理)
    # --- 导入 ---
    "E402",  # module-import-not-at-top (延迟导入在项目中常见)
    "F401",  # unused-import (__init__.py re-export 等)
    "F402",  # import-shadowed-by-loop-var
    "F811",  # redefined-while-unused
    "F841",  # unused-variable (待逐步修复)
    # --- 异常 / 控制流 ---
    "E701",  # multiple-statements-on-one-line-colon
    "E722",  # bare-except (待逐步修复)
    "E731",  # lambda-assignment
    "E741",  # ambiguous-variable-name
    "SIM102", # collapsible-if
    "SIM103", # needless-bool
    "SIM105", # suppressible-exception
    "SIM108", # if-else-block-instead-of-if-exp (三元表达式偏好)
    "SIM110", # reimplemented-builtin
    "SIM113", # enumerate-for-loop
    "SIM115", # open-file-with-context-handler
    "SIM118", # in-dict-keys
    # --- pyupgrade (待逐步迁移) ---
    "UP007",  # non-pep604-annotation-union
    "UP022",  # replace-stdout-stderr
    "UP031",  # printf-string-formatting
    "UP035",  # deprecated-import (typing 旧别名)
    "UP042",  # replace-str-enum
    # --- pep8-naming (项目现有命名模式) ---
    "N801",  # invalid-class-name
    "N802",  # invalid-function-name
    "N803",  # invalid-argument-name (工具接口用 camelCase 入参名，契约改动成本高)
    "N805",  # invalid-first-argument-name-for-method
    "N806",  # non-lowercase-variable-in-function
    "N812",  # lowercase-imported-as-non-lowercase
    "N816",  # mixed-case-variable-in-global-scope
    "N818",  # error-suffix-on-exception-name
    # --- pycodestyle 风格 (2026-09-22 分级: 真错误 F/E4 类拦截, 语句风格降级) ---
    "E702",  # multiple-statements-on-one-line-semicolon (330 处存量, 风格类)
    # --- pyupgrade 存量降级 (2026-09-22: 1500+ 自动修复后残余的手动项, 逐步清) ---
    "UP006",  # non-pep585-annotation (存量 typing.Dict/List, 逐步迁移)
    "UP009",  # utf8-encoding-coding-declaration
    "UP017",  # datetime-timezone-utc
    "UP037",  # quoted-annotation
    "UP041",  # timeout-error-alias
    "UP046",  # non-pep695-generic-class (Generic[T] → class Foo[T] 迁移, 存量1处)
    "UP047",  # non-pep695-generic-function
]

[tool.ruff.lint.per-file-ignores]
# 目录名含连字符/日期的历史目录: N999 模块名规则豁免
"coupled/omnilimb-face/**" = ["N999"]
"docs/archive/**" = ["N999"]
"tests/**/*.py" = [
    "N",     # 测试中命名约定灵活
    "E402",  # 测试可能需要延迟导入
    "F401",  # 导入用于验证模块可用性
    "F841",  # 测试中可能有占位变量
    "SIM",   # 测试中简化规则不适用
]
"scripts/**/*.py" = [
    "E402",  # 脚本常需 sys.path 调整后导入
    "F401",  # 脚本可能导入供副作用使用
    "N",     # 脚本命名约定灵活
]

[dependency-groups]
build = [
    "pyinstaller>=6.18.0",
]
test = [
    "google-genai>=2.22.0",
]

# ============ 测试分层（卷173）============
# 三层语义：smoke ⊂ core ⊂ full。未标注的测试默认按 full 对待。
# testpaths 限定裸 `pytest` 只跑根 tests/——其他模块测试用显式路径跑
# （如 `pytest mcpserver/tool_registry/tests`），防止裸调用扫全仓收集炸。
# NEKO 等非主线目录在收集期排除（norecursedirs 覆盖默认值，故写全）。
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".*", "*.egg", "_darcs", "{arch}", "CVS", "venv",
    "build", "dist", "node_modules",
    "NEKO", "vendor", "frontend", "research", "HamLog",
]
markers = [
    "smoke: 冒烟层（目标 ≤60s 全跑完；import + 主入口签名级）",
    "core: 核心层（目标 ≤10min；各模块主测试全量）",
    "full: 全量层（含慢测试；未标注文件默认归此层）",
]

# scan-trigger: 2026-10-09 starlette 1.7 lock 已含补丁版本
