appId: com.lumo.scratchpad
productName: 陆墨
# 产物文件名必须 ASCII：中文 productName 在 GitHub release asset 上传时会被**剥掉**
# （v5.2.0 草稿实测 → "-5.2.0-arm64.dmg"；v5.2.10 又踩一次 → "-5.2.10-arm64.dmg"
#   / "Setup.5.2.10.exe" / "-5.2.10.AppImage"）。
# 这笔设置由 c8f89bd9（v5.2.4 首发三修）加过，后来被 3711a9f8（10-07 大同步）覆盖掉，
# 本轮恢复并补上第二次踩坑的记录。
artifactName: Lumo-${version}-${arch}.${ext}
copyright: Copyright © 2026 陆墨

directories:
  buildResources: build
  output: release

afterPack: scripts/after-pack.mjs

files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/lodash.isequal/**/*
  - '!dist/models/重音テト/**'

# 音频/视频等二进制媒体文件从 asar 中解包到真实文件系统，
# 避免 HTMLAudioElement 通过自定义协议读取 asar 内文件失败
asarUnpack:
  - 'dist/voices/**/*'

extraResources:
  - from: build/icon.png
    to: build/icon.png
  - from: build/icon.ico
    to: build/icon.ico
  - from: premium-assets/backgrounds
    to: premium-assets/backgrounds
    filter:
      - '**/*'
      - '!.DS_Store'
  - from: ../characters
    to: characters
    filter:
      - '**/*'
      - '!.DS_Store'
  - from: backend-dist/naga-backend
    to: backend
    filter:
      - '**/*'
  - from: backend-dist/runtime
    to: runtime
    filter:
      - '**/*'
  - from: ../openclaw.LICENSE
    to: runtime/LICENSE

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # 自签名代码签名证书（开发者：陆墨）
  # 已禁用：自签名证书不适用，且明文密码存在安全风险
  # cscLink: build/codesign.pfx
  # cscKeyPassword: <从环境变量读取，禁止明文写入仓库>
  # 自定义签名钩子（win-sign.cjs）已停用：cscLink 证书配置已移除，
  # 钩子内部调 manager.doSign 时拿到 null 直接崩（Cannot use 'in' operator）。
  # 按 2026-09-28 决策「不做代码签名」，这里整体停用：
  # signtoolOptions:
  #   sign: scripts/win-sign.cjs

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  unicode: true
  shortcutName: 陆墨
  include: build/uninstaller.nsh

compression: normal

mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.png
  identity: null

dmg:
  size: 4g
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Utility

# ── publish 必需显式写 null，不能只是注释掉（2026-10-30）──────────────
# 这里本来是把 publish 整段注释掉（= undefined），意思是「不发布」。但 electron-builder
# 只把**显式的 null** 当成「不发布」，undefined 会走到另一条路：
#   getPublishConfigs() → publishers = config.publish（undefined，不是 null，不 return）
#   → resolvePublishConfigurations(undefined) → 数组里塞进 null
#   → createUpdateInfoTasks() 里 `publishConfiguration.provider` ⇒ TypeError
# 实证：v5.2.9 的 build job 三个平台全红在
#   `⨯ Cannot read properties of null (reading 'provider')  failedTask=build`
#   堆栈 createUpdateInfoTasks (app-builder-lib/out/publish/updateInfoBuilder)
# 显式 null 走的是 PublishManager.getPublishConfigs 的第一条分支：
#   `if (publishers === null) return null` ⇒ 不解析发布者、也不生成 latest*.yml 更新元数据。
# 我们不做自动更新，这正是想要的语义。
#
# 日后若要接自动更新：把这行改成下面注释里的对象，并把 owner/repo 改成**自己的**仓库
# （原来那段指向 RTGS2017/NagaAgent 上游，fork 不应检查上游更新，已废弃）。
publish: null

# 参考：接自己仓库的自动更新时形如
# publish:
#   provider: github
#   owner: fe1iscurc0r
#   repo: scratchfield
