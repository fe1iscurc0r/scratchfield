    </style>

    <script>
      (function () {
        function init() {
        const API_URL = '/api/tasks';
        const REPO = 'fe1iscurc0r/scratchpad';
        let allTasks = [];
        let currentFilter = 'all';

        const MOCK_TASKS = [
          { type: 'issue', number: 12, title: '修复 P0 频率白名单校验绕过问题', labels: [{ name: 'P0' }], state: 'OPEN', createdAt: '2026-08-17T10:00:00Z', comments: 3 },
          { type: 'issue', number: 11, title: '改进 IC-705 控制面板响应速度', labels: [{ name: 'P1' }, { name: '改进' }], state: 'OPEN', createdAt: '2026-08-16T08:30:00Z', comments: 1 },
          { type: 'issue', number: 9, title: '合规检查：业余频段限制与告警', labels: [{ name: '合规' }], state: 'OPEN', createdAt: '2026-08-14T12:00:00Z', comments: 0 },
          { type: 'issue', number: 7, title: 'P2 文档补充：mailslot 通信协议说明', labels: [{ name: 'P2' }], state: 'OPEN', createdAt: '2026-08-10T09:15:00Z', comments: 2 },
          { type: 'pr', number: 14, title: '添加 mailslot 通信心跳保活', head: 'feature/mailslot-heartbeat', base: 'main', ciStatus: 'success', createdAt: '2026-08-18T06:00:00Z' },
          { type: 'pr', number: 13, title: '重构频率设置接口以支持 whitelisting', head: 'refactor/freq-api', base: 'main', ciStatus: 'pending', createdAt: '2026-08-17T16:00:00Z' }
        ];

        function normalizeTasks(data) {
          if (Array.isArray(data)) return data;
          if (data && Array.isArray(data.tasks)) return data.tasks;
          if (data && (Array.isArray(data.issues) || Array.isArray(data.prs))) {
            const issues = (data.issues || []).map(i => ({ ...i, type: 'issue' }));
            const prs = (data.prs || []).map(p => ({ ...p, type: 'pr' }));
            return [...issues, ...prs];
          }
          return [];
        }

        async function loadTasks() {
          const refreshBtn = document.getElementById('refresh-btn');
          const list = document.getElementById('card-list');
          if (refreshBtn) refreshBtn.disabled = true;
          list.innerHTML = '<div class="loading-state"><i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i><span>正在加载任务数据…</span></div>';
          createIconsIn(list);

          try {
            const res = await fetch(API_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            allTasks = normalizeTasks(await res.json());
          } catch (err) {
            console.warn('无法连接 /api/tasks，使用演示数据：', err);
            allTasks = MOCK_TASKS;
            list.innerHTML = '<div class="error-state"><i data-lucide="triangle-alert" class="w-6 h-6"></i><span>后端 /api/tasks 未就绪，当前展示演示数据</span></div>';
            createIconsIn(list);
          }

          document.getElementById('last-updated').textContent = '更新于 ' + new Date().toLocaleString('zh-CN');
          renderStats(allTasks);
          renderCards(allTasks);
          if (refreshBtn) refreshBtn.disabled = false;
        }

        function hasLabel(item, name) {
          return (item.labels || []).some(l => (l.name || l).toLowerCase() === name.toLowerCase());
        }

        function renderStats(tasks) {
          const openTasks = tasks.filter(t => (t.state || 'OPEN').toUpperCase() !== 'CLOSED');
          const today = new Date().toISOString().slice(0, 10);
          setText('stat-open', openTasks.length);
          setText('stat-issues', openTasks.filter(t => t.type === 'issue').length);
          setText('stat-prs', openTasks.filter(t => t.type === 'pr').length);
          setText('stat-today', tasks.filter(t => (t.createdAt || '').slice(0, 10) === today).length);
          setText('stat-p0', tasks.filter(t => hasLabel(t, 'P0')).length);
          setText('stat-p1', tasks.filter(t => hasLabel(t, 'P1')).length);
          setText('stat-p2', tasks.filter(t => hasLabel(t, 'P2')).length);
          setText('stat-improvement', tasks.filter(t => hasLabel(t, '改进')).length);
          setText('stat-compliance', tasks.filter(t => hasLabel(t, '合规')).length);
        }

        function setText(id, value) {
          const el = document.getElementById(id);
          if (el) el.textContent = value;
        }

        function formatDate(iso) {
          if (!iso) return '-';
          const d = new Date(iso);
          return isNaN(d) ? iso : d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function labelClass(name) {
          const n = (name || '').toLowerCase();
          if (n === 'p0') return 'label-p0';
          if (n === 'p1') return 'label-p1';
          if (n === 'p2') return 'label-p2';
          if (n === '改进') return 'label-improvement';
          if (n === '合规') return 'label-compliance';
          return 'status-open';
        }

        function renderCards(tasks) {
          const list = document.getElementById('card-list');
          const filtered = currentFilter === 'all' ? tasks : tasks.filter(t => t.type === currentFilter);
          if (filtered.length === 0) {
            list.innerHTML = '<div class="empty-state"><i data-lucide="inbox" class="w-8 h-8"></i><span>暂无匹配任务</span></div>';
            createIconsIn(list);
            return;
          }
          list.innerHTML = filtered.map(t => t.type === 'issue' ? renderIssue(t) : renderPR(t)).join('');
          createIconsIn(list);
        }

        function renderIssue(issue) {
          const state = (issue.state || 'OPEN').toUpperCase();
          const url = `https://github.com/${REPO}/issues/${issue.number}`;
          const labels = (issue.labels || []).map(l => {
            const name = typeof l === 'string' ? l : l.name;
            return `<span class="label-pill ${labelClass(name)}">${escapeHtml(name)}</span>`;
          }).join('');
          return `<article class="task-card">
            <div class="task-card-header">
              <div class="task-icon"><i data-lucide="circle-dot" class="w-4 h-4"></i></div>
              <div class="task-title"><a href="${url}" target="_blank" rel="noopener noreferrer">#${issue.number} ${escapeHtml(issue.title)}</a></div>
            </div>
            <div class="task-meta">
              <span class="status-badge ${state === 'OPEN' ? 'status-open' : 'status-closed'}">${state === 'OPEN' ? 'OPEN' : 'CLOSED'}</span>
              ${labels}
            </div>
            <div class="task-meta">
              <span><i data-lucide="calendar" class="w-3 h-3"></i>${formatDate(issue.createdAt)}</span>
              <span><i data-lucide="message-circle" class="w-3 h-3"></i>${issue.comments || 0}</span>
            </div>
          </article>`;
        }

        function renderPR(pr) {
          const url = `https://github.com/${REPO}/pull/${pr.number}`;
          const ciClass = pr.ciStatus === 'success' ? 'ci-success' : pr.ciStatus === 'failure' ? 'ci-failure' : 'ci-pending';
          const ciText = pr.ciStatus === 'success' ? '通过' : pr.ciStatus === 'failure' ? '失败' : '进行中';
          return `<article class="task-card">
            <div class="task-card-header">
              <div class="task-icon"><i data-lucide="git-pull-request" class="w-4 h-4"></i></div>
              <div class="task-title"><a href="${url}" target="_blank" rel="noopener noreferrer">#${pr.number} ${escapeHtml(pr.title)}</a></div>
            </div>
            <div class="task-meta">
              <span class="status-badge status-open">PR</span>
              <span class="font-mono">${escapeHtml(pr.head || '-')} → ${escapeHtml(pr.base || '-')}</span>
            </div>
            <div class="task-meta">
              <span><span class="ci-dot ${ciClass}"></span>CI ${ciText}</span>
              <span><i data-lucide="calendar" class="w-3 h-3"></i>${formatDate(pr.createdAt)}</span>
            </div>
          </article>`;
        }

        function escapeHtml(str) {
          return String(str || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function createIconsIn(container) {
          if (window.lucide && container) {
            try { lucide.createIcons({ nodes: [container] }); } catch (e) { console.warn(e); }
          }
        }

        function setFilter(filter) {
          currentFilter = filter;
          document.querySelectorAll('.filter-bar .btn').forEach(btn => {
            if (btn.dataset.filter === filter) btn.classList.add('filter-active');
            else btn.classList.remove('filter-active');
          });
          renderCards(allTasks);
        }

        document.getElementById('refresh-btn').addEventListener('click', loadTasks);
        document.querySelectorAll('#tab-github .filter-bar .btn').forEach(btn => {
          btn.addEventListener('click', () => setFilter(btn.dataset.filter));
        });

        /* ===== Tab switching ===== */
        let currentTab = 'github';
        function switchTab(tab) {
          currentTab = tab;
          document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('tab-active', btn.dataset.tab === tab);
          });
          document.getElementById('tab-github').style.display = tab === 'github' ? '' : 'none';
          document.getElementById('tab-plans').style.display = tab === 'plans' ? '' : 'none';
          if (tab === 'plans') {
            renderPlanStats();
            renderPlans();
          }
        }
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        /* ===== Plans (localStorage) ===== */
        const STORAGE_KEY = 'lumo-task-plans-v1';
        let plans = [];
        let planFilter = 'all';

        const SAMPLE_PLANS = [
          { id: 'p1', title: '完成 IC-705 频率白名单功能测试', type: '工作', priority: 'P0', progress: 75, done: false, deadline: addDays(1).toISOString(), createdAt: Date.now() - 86400000 },
          { id: 'p2', title: '阅读《代码整洁之道》第 7 章', type: '学习', priority: 'P1', progress: 40, done: false, deadline: addDays(2).toISOString(), createdAt: Date.now() - 172800000 },
          { id: 'p3', title: '晨跑 5 公里', type: '健康', priority: 'P2', progress: 100, done: true, deadline: new Date().toISOString(), createdAt: Date.now() - 259200000 },
          { id: 'p4', title: '整理周末购物清单', type: '生活', priority: 'P2', progress: 20, done: false, deadline: addDays(3).toISOString(), createdAt: Date.now() - 43200000 },
          { id: 'p5', title: '回复邮件 & 整理待办事项', type: '待办', priority: 'P1', progress: 60, done: false, deadline: addDays(1).toISOString(), createdAt: Date.now() - 21600000 }
        ];

        function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); d.setHours(18, 0, 0, 0); return d; }

        function loadPlans() {
          try {
            const saved = localStorage.getItem(STORAGE_KEY);
            plans = saved ? JSON.parse(saved) : SAMPLE_PLANS;
          } catch (e) { plans = SAMPLE_PLANS; }
        }

        function savePlans() {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(plans)); } catch (e) {}
        }

        function addPlan(plan) {
          plans.unshift({
            id: 'p' + Date.now(),
            title: plan.title,
            type: plan.type,
            priority: plan.priority,
            progress: 0,
            done: false,
            deadline: plan.deadline || null,
            createdAt: Date.now()
          });
          savePlans();
          renderPlanStats();
          renderPlans();
        }

        function togglePlanDone(id) {
          const plan = plans.find(p => p.id === id);
          if (!plan) return;
          plan.done = !plan.done;
          plan.progress = plan.done ? 100 : (plan.progress < 100 ? plan.progress : 0);
          savePlans();
          renderPlanStats();
          renderPlans();
        }

        function setPlanProgress(id, progress) {
          const plan = plans.find(p => p.id === id);
          if (!plan) return;
          plan.progress = Math.max(0, Math.min(100, progress));
          plan.done = plan.progress >= 100;
          savePlans();
          renderPlanStats();
          renderPlans();
        }

        function deletePlan(id) {
          plans = plans.filter(p => p.id !== id);
          savePlans();
          renderPlanStats();
          renderPlans();
        }

        function renderPlanStats() {
          const total = plans.length;
          const done = plans.filter(p => p.done).length;
          const doing = total - done;
          const todayStr = new Date().toISOString().slice(0, 10);
          const todayDeadline = plans.filter(p => {
            if (!p.deadline || p.done) return false;
            return new Date(p.deadline).toISOString().slice(0, 10) === todayStr;
          }).length;
          setText('plan-total', total);
          setText('plan-done', done);
          setText('plan-doing', doing);
          setText('plan-today', todayDeadline);

          const pct = total > 0 ? Math.round(plans.reduce((s, p) => s + p.progress, 0) / total) : 0;
          setText('plan-progress-pct', pct + '%');
          const fill = document.getElementById('plan-progress-fill');
          if (fill) fill.style.width = pct + '%';
        }

        function isDeadlineSoon(deadline) {
          if (!deadline) return false;
          const diff = new Date(deadline) - new Date();
          return diff > 0 && diff < 24 * 3600 * 1000;
        }

        function isOverdue(deadline, done) {
          if (done || !deadline) return false;
          return new Date(deadline) < new Date();
        }

        function formatDeadline(deadline) {
          if (!deadline) return '无截止';
          const d = new Date(deadline);
          const now = new Date();
          const diff = d - now;
          const dayDiff = Math.ceil(diff / (1000 * 60 * 60 * 24));
          const dateStr = d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
          if (diff < 0) return '已逾期';
          if (dayDiff === 0) return '今天 ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
          if (dayDiff === 1) return '明天 ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
          return dateStr;
        }

        function priorityClass(p) {
          if (p === 'P0') return 'label-p0';
          if (p === 'P1') return 'label-p1';
          return 'label-p2';
        }

        function typeClass(t) { return 'type-' + t; }

        function renderPlans() {
          const list = document.getElementById('plan-list');
          let filtered = plans;
          if (planFilter === 'doing') filtered = plans.filter(p => !p.done);
          else if (planFilter === 'done') filtered = plans.filter(p => p.done);

          // Sort: P0 > P1 > P2, then not-done first
          const priorityOrder = { P0: 0, P1: 1, P2: 2 };
          filtered = [...filtered].sort((a, b) => {
            if (a.done !== b.done) return a.done ? 1 : -1;
            return (priorityOrder[a.priority] ?? 3) - (priorityOrder[b.priority] ?? 3);
          });

          if (filtered.length === 0) {
            list.innerHTML = '<div class="empty-state"><i data-lucide="clipboard-list" class="w-8 h-8"></i><span>' + (planFilter === 'done' ? '还没有已完成的计划' : planFilter === 'doing' ? '所有计划都完成了！' : '还没有计划，点击「新建」添加第一条') + '</span></div>';
            createIconsIn(list);
            return;
          }

          list.innerHTML = filtered.map(p => renderPlanCard(p)).join('');
          createIconsIn(list);

          // Bind plan interactions
          filtered.forEach(p => {
            const checkbox = document.querySelector(`[data-plan-id="${p.id}"] .plan-checkbox`);
            if (checkbox) checkbox.addEventListener('click', () => togglePlanDone(p.id));
            const delBtn = document.querySelector(`[data-plan-id="${p.id}"] [data-action="delete"]`);
            if (delBtn) delBtn.addEventListener('click', () => { if (confirm('确认删除这条计划？')) deletePlan(p.id); });
            const track = document.querySelector(`[data-plan-id="${p.id}"] .plan-progress-track`);
            if (track) {
              track.addEventListener('click', (e) => {
                const rect = track.getBoundingClientRect();
                const pct = Math.round(((e.clientX - rect.left) / rect.width) * 100);
                setPlanProgress(p.id, pct);
              });
            }
          });
        }

        function renderPlanCard(plan) {
          const overdue = isOverdue(plan.deadline, plan.done);
          const soon = isDeadlineSoon(plan.deadline);
          const deadlineClass = overdue ? 'deadline-soon' : (soon ? 'deadline-soon' : '');
          const deadlineIcon = overdue ? 'alert-circle' : 'clock';

          return `<article class="plan-card ${plan.done ? 'is-done' : ''}" data-plan-id="${plan.id}">
            <div class="plan-card-header">
              <button class="plan-checkbox ${plan.done ? 'is-checked' : ''}" type="button" aria-label="切换完成状态">
                ${plan.done ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
              </button>
              <div class="plan-card-title">${escapeHtml(plan.title)}</div>
            </div>
            <div class="plan-meta">
              <span class="plan-type-badge ${typeClass(plan.type)}"><i data-lucide="tag" class="w-3 h-3"></i>${escapeHtml(plan.type)}</span>
              <span class="label-pill ${priorityClass(plan.priority)}">${plan.priority}</span>
            </div>
            <div class="plan-progress">
              <div class="plan-progress-top">
                <span>进度</span>
                <span>${plan.progress}%</span>
              </div>
              <div class="plan-progress-track" title="点击调整进度">
                <div class="plan-progress-fill" style="width:${plan.progress}%"></div>
              </div>
            </div>
            <div class="plan-meta">
              <span class="${deadlineClass}"><i data-lucide="${deadlineIcon}" class="w-3 h-3"></i>${formatDeadline(plan.deadline)}</span>
            </div>
            <div class="plan-actions">
              <button class="plan-action-btn is-danger" data-action="delete" type="button">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                <span>删除</span>
              </button>
            </div>
          </article>`;
        }

        /* Plan form */
        function togglePlanForm(show) {
          const form = document.getElementById('plan-form');
          if (show === undefined) show = form.style.display === 'none';
          form.style.display = show ? '' : 'none';
          if (show) {
            const titleInput = document.getElementById('plan-title-input');
            if (titleInput) setTimeout(() => titleInput.focus(), 50);
          }
        }

        function handleSavePlan() {
          const title = document.getElementById('plan-title-input').value.trim();
          const type = document.getElementById('plan-type-input').value;
          const priority = document.getElementById('plan-priority-input').value;
          const deadlineVal = document.getElementById('plan-deadline-input').value;
          const deadline = deadlineVal ? new Date(deadlineVal).toISOString() : null;

          if (!title) { alert('请输入计划标题'); return; }

          addPlan({ title, type, priority, deadline });
          // Reset form
          document.getElementById('plan-title-input').value = '';
          document.getElementById('plan-type-input').value = '待办';
          document.getElementById('plan-priority-input').value = 'P1';
          document.getElementById('plan-deadline-input').value = '';
          togglePlanForm(false);
        }

        document.getElementById('add-plan-btn').addEventListener('click', () => togglePlanForm(true));
        document.getElementById('plan-cancel-btn').addEventListener('click', () => togglePlanForm(false));
        document.getElementById('plan-save-btn').addEventListener('click', handleSavePlan);
        document.getElementById('plan-title-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') handleSavePlan();
        });

        // Plan filter
        function setPlanFilter(filter) {
          planFilter = filter;
          document.querySelectorAll('#tab-plans .filter-bar .btn[data-plan-filter]').forEach(btn => {
            btn.classList.toggle('filter-active', btn.dataset.planFilter === filter);
          });
          renderPlans();
        }
        document.querySelectorAll('#tab-plans .filter-bar .btn[data-plan-filter]').forEach(btn => {
          btn.addEventListener('click', () => setPlanFilter(btn.dataset.planFilter));
        });

        // Init plans
        loadPlans();
        renderPlanStats();

        loadTasks();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
    </script>
