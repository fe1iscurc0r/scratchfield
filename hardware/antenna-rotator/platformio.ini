; PlatformIO 工程（卷129 天线云台运动层）——备选构建路径
; 本机验证走 arduino-cli（见 README）；装了 pio 的话可直接：
;   pio run -e esp32s3 -d hardware/antenna-rotator
;   pio run -e esp32s3 -t upload -d hardware/antenna-rotator
[platformio]
default_envs = esp32s3
src_dir = .
; tests 目录是主机端 Python 规格测试，不参与固件构建
test_dir = tests

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
build_src_filter =
    +<*.ino>
    +<motion/>
    -<tests/>
