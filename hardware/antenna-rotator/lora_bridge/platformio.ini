; PlatformIO 工程（卷130 W130-02 LoRa433 遥控桥）
;
; 桥板：ESP32-S3 + SX1278（433MHz），一头接 SX1278，一头接被控板的串口命令面。
;
; 构建（**需要 RadioLib**，平台会按 lib_deps 自动装）：
;   pio run  -e esp32s3 -d hardware/antenna-rotator/lora_bridge
;   pio run  -e esp32s3 -t upload -d hardware/antenna-rotator/lora_bridge
;
; 只验证纯逻辑（无硬件、无 RadioLib 也能过）：
;   pio run -e logic-only -d hardware/antenna-rotator/lora_bridge
;
; 安全提示：433MHz 属各国 ISM 频段但功率/占空比规则不同，
; 部署前按当地法规确认 `LORA_POWER_DBM` 与频点。

[platformio]
default_envs = esp32s3
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    ; SX1278 驱动（MIT）；锁大版本，避免上位 API 漂移
    jgromes/RadioLib@^6.6.0
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    ; 打开真机驱动（只有这个 env 装 RadioLib）
    -DANTENNA_ENABLE_RADIOLIB=1

; 纯逻辑环境：不装 RadioLib、不编真机驱动。
; 用途是让「组帧/解帧/校验」在无硬件环境可验证——这三段是跨层协议，
; 必须能在任何机器上跑，不能绑在板子上。
[env:logic-only]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
build_src_filter =
    +<*.ino>
