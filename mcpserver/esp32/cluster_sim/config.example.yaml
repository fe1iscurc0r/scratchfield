# 工单 243 · 分簇模拟器配置（示例）
#
# 用法：
#   from mcpserver.esp32.cluster_sim import load_config, simulate
#   report = simulate(load_config("mcpserver/esp32/cluster_sim/config.example.yaml"))
#
# 拷贝一份改成自己的站点参数再跑；本文件是「示例」不是运行时读取的默认值
# （模块默认值见 mcpserver/esp32/cluster_sim/config.py::DEFAULT_CONFIG）。

# ---- 工单 §2 任务一.2 要求的四项 ----
nodes: 50                    # 节点数（正整数）
area: [30000.0, 30000.0]     # 区域 [宽, 高]，单位 m
rssi_threshold: -110.0       # 可达阈值 dBm：RSSI ≥ 此值即视为连通
simulate_duration: 1.0       # 观测窗口（小时）；**静态快照口径**，不驱动时变过程

# ---- 扩展项（可全部缺省）----
topology: random             # grid | random | lora_deployment
max_hops: 2                  # 簇内允许的最大中继跳数（跳数放宽 ⇒ 簇更大但中继更远）
failure_rate: 0.0            # 初始失活比例 [0, 1]
unstable_margin_db: 6.0      # 距阈值不足该裕量即标为「不稳定链路」（抖动即断）
tx_power_dbm: 14.0           # 节点发射功率 dBm
freq_hz: 433920000.0         # 载频 Hz（433.92 MHz = 433 ISM 子带中心）
path_loss_exponent: 2.7      # 对数距离路损指数（2.0 自由空间；2.7 近地/郊区）
seed: 20261014               # 随机种子（random / lora_deployment 用；可复现）

# ⚠️ 为什么 area 默认给到 30 km × 30 km（而不是几百米）
#
# LoRa（SF7 / 125 kHz / 灵敏度约 −123 dBm）单跳覆盖可达数公里。区域取小了，
# 所有节点互相可达 ⇒ 全网**单一巨簇**，节点失活根本不改变最大簇规模，
# 失活率→重建成功率曲线会是一条平线（实测 500 m × 500 m 下 5%~30% 全档同为 87.5%）。
#
# 30 km × 30 km + 阈值 −110 dBm + 路损指数 2.7 ⇒
#   解析可达半径 r ≈ 4.56 km、解析平均度 λπr² ≈ 3.6（参考点路损 ≈ 25.20 dB @433.92 MHz）；
#   **实测平均度 ≈ 3.0**（10 个 seed 均值 3.06，区间 2.56~3.92 —— 低于解析值是因为边界节点邻居更少）。
# 随机几何图的**连通相变**约在平均度 4.5 附近 ⇒ 本基线处在**相变之下的多簇区**，
# 实测 12 簇（解析簇数上界 area/(πr²) ≈ 13.8，吻合），簇边界会随节点失活迁移
# —— 此时分簇算法与冗余策略才有可观测的差异。
#
# 若你的实际站点就是小范围（例如厂区 500 m），请如实填写 —— 但要知道在那样的
# 拓扑下「自适应分簇」几乎退化为「分不分都一样」，结论要按实际区域解读。
