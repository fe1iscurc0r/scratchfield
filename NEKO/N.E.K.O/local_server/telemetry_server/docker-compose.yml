version: "3.8"

services:
  telemetry:
    build: .
    ports:
      - "8099:8099"
    volumes:
      - ./data:/app/data
    environment:
      # 存储中的业务时间戳固定为 +08:00，容器时区同样固定为 Asia/Shanghai。
      - TZ=Asia/Shanghai
      # ★ Required, no fallback: the source tree keeps no HMAC key any more.
      # The `:?` interpolation makes `docker compose up` abort before the
      # container is created when the value is unset or empty — a
      # misconfigured deployment cannot silently serve traffic. See .env.example.
      - TELEMETRY_HMAC_SECRET=${TELEMETRY_HMAC_SECRET:?TELEMETRY_HMAC_SECRET must be set in .env (see .env.example)}
      # ★ Must override: admin auth token (used for dashboard / export / queries).
      # Set TELEMETRY_ADMIN_TOKEN in your .env file (or shell environment) before
      # running docker-compose; otherwise the container falls back to a clearly
      # invalid placeholder and the admin API must not be considered secure.
      - TELEMETRY_ADMIN_TOKEN=${TELEMETRY_ADMIN_TOKEN:-please-change-me}
      # 可选：启用 /docs Swagger 页面
      # - TELEMETRY_ENABLE_DOCS=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
